name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    # Lo que necesita python-coverage-comment-action: escribir la branch de
    # datos del badge y comentar en los PRs.
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Estilo y errores obvios. La config vive en setup.cfg, así que acá no
      # va ninguna flag: `flake8 .` lee de ahí el largo de línea y los excludes.
      - name: Lint
        run: flake8 .

      - name: Run tests with coverage
        run: coverage run -m unittest discover -v

      # El umbral del 90% vive en .coveragerc (fail_under), así que este paso
      # falla la build si la cobertura baja de ahí.
      - name: Check coverage
        run: |
          coverage report -m
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Complejidad ciclomática. Hoy el peor bloque es play() con B (9); los
      # umbrales están puestos en el estado actual para que la build falle si
      # algo empeora, no para pedir un refactor ahora.
      - name: Check complexity
        run: xenon --max-absolute B --max-modules B --max-average A run.py test_run.py

      # Badge y comentario de cobertura sin servicio externo: en push a main la
      # action guarda el badge en la branch python-coverage-comment-action-data
      # de este mismo repo, y en un PR deja el detalle línea por línea como
      # comentario. Sólo una pata de la matriz, si no se pisan entre sí.
      - name: Coverage badge and PR comment
        if: matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  # Nadie hostea un badge de complejidad, así que lo generamos: `radon -j` da el
  # detalle por bloque, de ahí sale el peor rank del repo y se publica como
  # endpoint de shields.io en su propia branch de datos.
  #
  # Va en un job aparte a propósito: python-coverage-comment-action corre en
  # Docker como root y deja el .git del workspace con dueño root, así que
  # cualquier `git commit` posterior en ese mismo job muere con
  # "could not open '.git/COMMIT_EDITMSG': Permission denied". Un job nuevo
  # arranca con un checkout limpio.
  complexity-badge:
    needs: unittest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install radon
        run: pip install -r requirements-dev.txt

      - name: Publish complexity badge
        run: |
          cat > "$RUNNER_TEMP/badge.py" <<'PY'
          import json, sys

          COLORS = {'A': 'brightgreen', 'B': 'yellowgreen', 'C': 'yellow',
                    'D': 'orange', 'E': 'orangered', 'F': 'red'}

          blocks = []

          def walk(bs):
              for b in bs:
                  blocks.append(b)
                  walk(b.get('closures', []))

          for path, bs in json.load(sys.stdin).items():
              if isinstance(bs, dict):  # radon informa errores como {"error": ...}
                  sys.exit(f"radon no pudo leer {path}: {bs}")
              walk(bs)

          worst = max(blocks, key=lambda b: b['complexity'])
          json.dump({
              'schemaVersion': 1,
              'label': 'complexity',
              'message': f"{worst['rank']} ({worst['complexity']})",
              'color': COLORS[worst['rank']],
          }, sys.stdout)
          PY
          radon cc run.py test_run.py -j | python "$RUNNER_TEMP/badge.py" > "$RUNNER_TEMP/endpoint.json"
          cat "$RUNNER_TEMP/endpoint.json"

          # La branch es sólo data generada, así que se reescribe entera en cada
          # push: un único commit huérfano, sin historia que mantener.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan complexity-badge-data
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/endpoint.json" endpoint.json
          git add -f endpoint.json
          git commit -m "Complexity badge for ${GITHUB_SHA:0:7}"
          git push -f origin complexity-badge-data
