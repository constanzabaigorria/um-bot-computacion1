name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    # Lo que necesita python-coverage-comment-action: escribir la branch de
    # datos del badge y comentar en los PRs.
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: coverage run -m unittest discover -v

      # El umbral del 90% vive en .coveragerc (fail_under), así que este paso
      # falla la build si la cobertura baja de ahí.
      - name: Check coverage
        run: |
          coverage report -m
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Complejidad ciclomática. Hoy el peor bloque es play() con B (9); los
      # umbrales están puestos en el estado actual para que la build falle si
      # algo empeora, no para pedir un refactor ahora.
      - name: Check complexity
        run: xenon --max-absolute B --max-modules B --max-average A run.py test_run.py

      # Badge y comentario de cobertura sin servicio externo: en push a main la
      # action guarda el badge en la branch python-coverage-comment-action-data
      # de este mismo repo, y en un PR deja el detalle línea por línea como
      # comentario. Sólo una pata de la matriz, si no se pisan entre sí.
      - name: Coverage badge and PR comment
        if: matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
